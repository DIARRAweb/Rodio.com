<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FASOKOCOM</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

  <style>
    body{
      margin:0;
      background:#111;
      font-family: Arial, sans-serif;
      color:white;
      text-align:center;
    }

    .overlay{
      background:rgba(0,0,0,0.7);
      min-height:100vh;
      padding:20px;
    }

    h1{
      color:#00ff9c;
      font-size:32px;
    }

    button{
      padding:15px;
      font-size:16px;
      margin:10px;
      border:none;
      border-radius:8px;
      background:#00ff9c;
      cursor:pointer;
      width:90%;
      max-width:400px;
    }

    #map{
      height:450px;
      width:95%;
      margin:auto;
      border-radius:12px;
      border:2px solid #00ff9c;
    }

    #position{
      margin-top:10px;
      font-size:14px;
    }
  </style>
</head>

<body>
  <div class="overlay">
    <h1>🇲🇱 FASOKOCOM</h1>
    <p>Carte tactique en temps réel</p>

    <button onclick="showPosition()">📍 MA POSITION</button>

    <p id="position">Position non disponible</p>

    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, onDisconnect, remove } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js";

    // Firebase Config (FASOKOCOM2)
    const firebaseConfig = {
      apiKey: "AIzaSyA83FA1Ne_qjYoIYHtsOXc7j3h3bdTOgLQ",
      authDomain: "fasokocom2.firebaseapp.com",
      projectId: "fasokocom2",
      storageBucket: "fasokocom2.firebasestorage.app",
      messagingSenderId: "730331164569",
      appId: "1:730331164569:web:8e984ad9d88a30bf2c2d08"
    };

    // Init Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Nom agent
    let fullName = prompt("Entrez votre Nom + Grade (ex: Capitaine Idrissa DIARRA)") || "Agent inconnu";

    // ID unique
    let userId = "agent_" + Math.floor(Math.random() * 1000000);
    let userRef = ref(db, "users/" + userId);

    // Supprimer automatiquement quand l’utilisateur quitte
    onDisconnect(userRef).remove();

    // Leaflet map
    let map = L.map("map").setView([12.6392, -8.0029], 13);

    let normal = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19
    });

    normal.addTo(map);

    // Marqueurs équipe
    let markers = {};

    // Afficher ma position manuellement
    window.showPosition = function(){
      navigator.geolocation.getCurrentPosition((pos)=>{
        let lat = pos.coords.latitude;
        let lon = pos.coords.longitude;
        let accuracy = pos.coords.accuracy;

        document.getElementById("position").innerHTML =
          "Latitude: " + lat +
          "<br>Longitude: " + lon +
          "<br>Précision: " + Math.round(accuracy) + " m";

        map.setView([lat, lon], 16);
      }, (err)=>{
        alert("Erreur GPS : " + err.message);
      }, {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      });
    }

    // Tracking automatique + envoi Firebase
    navigator.geolocation.watchPosition((pos) => {
      let lat = pos.coords.latitude;
      let lon = pos.coords.longitude;
      let accuracy = pos.coords.accuracy;

      // Si précision trop mauvaise on ignore
      if(accuracy > 50) return;

      set(userRef, {
        name: fullName,
        latitude: lat,
        longitude: lon,
        accuracy: accuracy,
        timestamp: Date.now()
      });

    }, (err) => {
      console.log("Erreur GPS :", err.message);
    }, {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    });

    // Lire les positions en temps réel
    onValue(ref(db, "users"), (snapshot) => {
      const data = snapshot.val();
      if(!data) return;

      // supprimer marqueurs anciens non existants
      for(let id in markers){
        if(!data[id]){
          map.removeLayer(markers[id]);
          delete markers[id];
        }
      }

      // ajouter / mettre à jour
      for (let id in data) {
        let user = data[id];
        if(!user.latitude || !user.longitude) continue;

        let displayName = user.name || "Agent";

        if(markers[id]){
          markers[id].setLatLng([user.latitude, user.longitude]);
        } else {
          markers[id] = L.marker([user.latitude, user.longitude])
            .addTo(map)
            .bindPopup("<b>" + displayName + "</b><br>Précision: " + Math.round(user.accuracy || 0) + " m");
        }
      }
    });

  </script>
</body>
</html>
