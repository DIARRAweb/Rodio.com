<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FASOKOCOM</title>

  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"/>

  <style>
    body{
      margin:0;
      background:#111;
      font-family: Arial, sans-serif;
      color:white;
      text-align:center;
    }

    .overlay{
      background:rgba(0,0,0,0.7);
      min-height:100vh;
      padding:20px;
    }

    h1{
      color:#00ff9c;
      font-size:32px;
    }

    button{
      padding:15px;
      font-size:16px;
      margin:10px;
      border:none;
      border-radius:8px;
      background:#00ff9c;
      cursor:pointer;
      width:90%;
      max-width:400px;
    }

   #map{
      height: 500px;
      width: 95%;
      margin: auto;
      border-radius: 12px;
      border: 2px solid #00ff9c;
      overflow: hidden;
    }

    #position{
      margin-top:10px;
      font-size:14px;
    }
  </style>
</head>

<body>
  <div class="overlay">
    <h1>🇲🇱 FASOKOCOM</h1>
    <p>Carte tactique en temps réel</p>

    <button onclick="showPosition()">📍 MA POSITION</button>
    <button onclick="showMap()">🗺 CARTE DE L'ÉQUIPE</button>
    
    <p id="position">Position non disponible</p>

    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getDatabase, ref, set, onValue, onDisconnect, remove } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js";

// Firebase Config (FASOKOCOM2)
const firebaseConfig = {
  apiKey: "AIzaSyA83FA1Ne_qjYoIYHtsOXc7j3h3bdTOgLQ",
  authDomain: "fasokocom2.firebaseapp.com",
  projectId: "fasokocom2",
  storageBucket: "fasokocom2.firebasestorage.app",
  messagingSenderId: "730331164569",
  appId: "1:730331164569:web:8e984ad9d88a30bf2c2d08"
};

// Init Firebase
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// Nom agent
let fullName = prompt("Entrez votre Nom + Grade (ex: Capitaine Idrissa DIARRA)") || "Agent inconnu";

// ID unique
let userId = "agent_" + Math.floor(Math.random() * 1000000);
let userRef = ref(db, "users/" + userId);

// Supprimer automatiquement quand l’utilisateur quitte
onDisconnect(userRef).remove();

// ---------------- STYLES MAP ----------------
const normalStyle = "https://demotiles.maplibre.org/style.json";

const satelliteStyle = {
  version: 8,
  sources: {
    esri: {
      type: "raster",
      tiles: [
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
      ],
      tileSize: 256,
      attribution: "Esri"
    }
  },
  layers: [
    {
      id: "satellite",
      type: "raster",
      source: "esri"
    }
  ]
};

const reliefStyle = "https://tiles.stadiamaps.com/styles/outdoors.json";

// ---------------- MAPLIBRE MAP ----------------
let map = new maplibregl.Map({
  container: "map",
  style: normalStyle,
  center: [-8.0029, 12.6392],
  zoom: 13
});

// Zoom + boussole + rotation
map.addControl(new maplibregl.NavigationControl(), "top-right");

// ---------------- CONTROLE TYPE CARTE (comme Leaflet) ----------------
class StyleSwitcherControl {
  onAdd(map) {
    this.map = map;
    this.container = document.createElement("div");
    this.container.className = "maplibregl-ctrl maplibregl-ctrl-group";

    const btn = document.createElement("button");
    btn.innerHTML = "🗺";
    btn.title = "Changer la carte";

    btn.onclick = () => {
      let choix = prompt("Choisir la carte:\n1 = Normal\n2 = Satellite\n3 = Relief");
      if (choix === "1") map.setStyle(normalStyle);
      if (choix === "2") map.setStyle(satelliteStyle);
      if (choix === "3") map.setStyle(reliefStyle);
    };

    this.container.appendChild(btn);
    return this.container;
  }

  onRemove() {
    this.container.parentNode.removeChild(this.container);
    this.map = undefined;
  }
}

map.addControl(new StyleSwitcherControl(), "top-right");

// ---------------- MARKERS ----------------
let markers = {}; // { id: maplibre Marker }

// Fonction mise à jour marker
function updateMarker(id, lat, lon, popupText) {
  if (markers[id]) {
    markers[id].setLngLat([lon, lat]);
  } else {
    let popup = new maplibregl.Popup({ offset: 25 }).setHTML(popupText);

    markers[id] = new maplibregl.Marker()
      .setLngLat([lon, lat])
      .setPopup(popup)
      .addTo(map);
  }
}

// ---------------- BOUTON MA POSITION ----------------
window.showPosition = function () {
  navigator.geolocation.getCurrentPosition((pos) => {
    let lat = pos.coords.latitude;
    let lon = pos.coords.longitude;
    let accuracy = pos.coords.accuracy;

    document.getElementById("position").innerHTML =
      "Latitude: " + lat +
      "<br>Longitude: " + lon +
      "<br>Précision: " + Math.round(accuracy) + " m";

    map.flyTo({
      center: [lon, lat],
      zoom: 16
    });

  }, (err) => {
    alert("Erreur GPS : " + err.message);
  }, {
    enableHighAccuracy: true,
    timeout: 10000,
    maximumAge: 0
  });
};

// ---------------- BOUTON CARTE DE L'EQUIPE ----------------
window.showMap = function () {
  let bounds = new maplibregl.LngLatBounds();
  let count = 0;

  for (let id in markers) {
    let lngLat = markers[id].getLngLat();
    bounds.extend(lngLat);
    count++;
  }

  if (count === 0) {
    alert("Aucun agent trouvé sur la carte.");
    return;
  }

  map.fitBounds(bounds, {
    padding: 50,
    maxZoom: 16
  });
};

// ---------------- TRACKING + ENVOI FIREBASE ----------------
navigator.geolocation.watchPosition((pos) => {
  let lat = pos.coords.latitude;
  let lon = pos.coords.longitude;
  let accuracy = pos.coords.accuracy;

  if (accuracy > 50) return;

  set(userRef, {
    name: fullName,
    latitude: lat,
    longitude: lon,
    accuracy: accuracy,
    timestamp: Date.now()
  });

}, (err) => {
  console.log("Erreur GPS :", err.message);
}, {
  enableHighAccuracy: true,
  timeout: 10000,
  maximumAge: 0
});

// ---------------- LECTURE POSITIONS EN TEMPS REEL ----------------
onValue(ref(db, "users"), (snapshot) => {
  const data = snapshot.val();
  if (!data) return;

  // Supprimer marqueurs qui n'existent plus
  for (let id in markers) {
    if (!data[id]) {
      markers[id].remove();
      delete markers[id];
    }
  }

  // Ajouter / mettre à jour
  for (let id in data) {
    let user = data[id];

    // Supprimer agents fantômes (+2 minutes)
    if (user.timestamp && (Date.now() - user.timestamp > 120000)) {
      remove(ref(db, "users/" + id));
      continue;
    }

    if (!user.latitude || !user.longitude) continue;

    let displayName = user.name || "Agent";
    let popupText = "<b>" + displayName + "</b><br>Précision: " + Math.round(user.accuracy || 0) + " m";

    updateMarker(id, user.latitude, user.longitude, popupText);
  }
});
</script>
</body>
</html>
